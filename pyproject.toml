[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "when-to-reflect"
version = "0.1.0"
description = "Experiments on when language models should reflect."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/when_to_reflect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
