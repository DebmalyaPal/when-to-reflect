# State-level reflection-utility dataset over MATH training problems.
# Development settings for the local small model; not final decoding settings.
dataset: EleutherAI/hendrycks_math
dataset_path: data/raw/math_train
first_problem_index: 0
num_problems: 5  # raise to 10 without code changes
output_path: outputs/dev/math_utility_dataset.json

model_id: Qwen/Qwen2.5-0.5B-Instruct
base_seed: 42

# Deterministic base trajectory; segmentation and checkpoint selection run on it.
base_trace:
  max_new_tokens: 1024

# Identical decoding for the direct and reflection branches.
rollout:
  num_rollouts: 4
  do_sample: true
  temperature: 0.7
  top_p: 0.95
  max_new_tokens: 1024

# Frozen by the intervention-format audit (docs/REFLECTION_PROMPT_AUDIT.md) as the
# development reflection operator for Qwen2.5-0.5B. Assistant-monologue format:
# appended verbatim inside the running assistant turn, after the exact shared
# prefix, with no role delimiters. Development freeze only; not carried over to
# Qwen3-8B without a fresh fidelity check.
reflection_prompt_version: assistant_monologue_local_v1
reflection_instruction: "Let me check the reasoning so far for a local mistake. If I find one, I'll correct it and continue from here."
